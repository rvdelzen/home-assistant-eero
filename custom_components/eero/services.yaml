list_port_forwards:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: eero
    network:
      required: false
      example: My Network
      selector:
        text:

create_port_forward:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: eero
    network:
      required: false
      example: My Network
      selector:
        text:
    ip:
      required: true
      example: "192.168.4.50"
      selector:
        text:
    client_port:
      required: true
      example: 80
      selector:
        number:
          min: 1
          max: 65535
          mode: box
    gateway_port:
      required: true
      example: 8080
      selector:
        number:
          min: 1
          max: 65535
          mode: box
    protocol:
      required: true
      example: tcp
      selector:
        select:
          options:
            - tcp
            - udp
    description:
      required: false
      example: Camera
      selector:
        text:
    enabled:
      required: false
      default: true
      selector:
        boolean:
    dry_run:
      required: false
      default: false
      selector:
        boolean:

delete_port_forward:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: eero
    network:
      required: false
      example: My Network
      selector:
        text:
    forward_id:
      required: false
      example: "12345678"
      selector:
        text:
    ip:
      required: false
      example: "192.168.4.50"
      selector:
        text:
    gateway_port:
      required: false
      example: 8080
      selector:
        number:
          min: 1
          max: 65535
          mode: box
    protocol:
      required: false
      example: tcp
      selector:
        select:
          options:
            - tcp
            - udp
    dry_run:
      required: false
      default: false
      selector:
        boolean:
